id: offline-resend
description: 发送时断网，重连后自动重发
status: manual
context:
  - 虚构应用的合同是重连后自动重发，不以手工重发替代
  - 用户已打开 Alice 会话，输入一条可辨识的测试消息
steps:
  - action: 在发送前注入用户侧断网
  - action: 发送该消息
    expect: 消息保留为待重发，不丢失输入
  - action: 恢复网络并等待自动重发
    expect: 同一条消息自动收敛为已发送，且没有重复消息
  - action:
      ref: ../story.yaml
