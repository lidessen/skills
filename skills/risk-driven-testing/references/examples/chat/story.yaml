id: direct-chat
description: 用户打开 Alice 会话并发送消息
status: manual
context:
  - 虚构聊天应用的行为示例，不代表已有实测结果
  - 用户已登录，从会话列表开始，Alice 是唯一匹配的测试联系人
steps:
  - action: 打开 Alice 的会话
    expect: Alice 的会话已打开，消息输入框可用
  - action: 输入测试消息并发送
    expect:
      - 同一条消息显示为已发送
      - 输入框清空
  - action:
      ref: ./features/send-message.yaml
lookup:
  - 消息发送入口与发送状态转换
  - 会话输入组件的发送处理
